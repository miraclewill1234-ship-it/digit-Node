<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My 3D Scene</title>
<style>
  :root { --bg: #0b0b1a; --fg: #ffffff; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  canvas { position: fixed; top: 0; left: 0; display: block; }
  .hint { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: 14px; opacity: .7; pointer-events: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="hint"> · </div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b1a);
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 5, 50);
const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#bg') });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);

const pointLight = new THREE.PointLight(0xffffff, 1.4);
pointLight.position.set(0, 20, 20);
scene.add(pointLight, new THREE.AmbientLight(0xffffff, 0.4));

const cube = new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshStandardMaterial({ color: 0xff6347 }));
cube.position.set(-18, 0, 0);
const ico = new THREE.Mesh(new THREE.IcosahedronGeometry(8), new THREE.MeshStandardMaterial({ color: 0x00ff88, flatShading: true }));
ico.position.set(18, 0, 0);
const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(5, 1.2, 200, 16), new THREE.MeshStandardMaterial({ color: 0x66aaff, metalness: 0.8, roughness: 0.2 }));
knot.position.set(0, 15, -10);
scene.add(cube, ico, knot);

const n = 1500, pos = new Float32Array(n * 3);
for (let i = 0; i < pos.length; i++) pos[i] = THREE.MathUtils.randFloatSpread(300);
const sg = new THREE.BufferGeometry();
sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
const stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 }));
scene.add(stars);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  cube.rotation.x += 0.01; cube.rotation.y += 0.01;
  ico.rotation.y -= 0.03; ico.rotation.z -= 0.03;
  knot.rotation.x += 0.02;
  knot.position.y = 15 + Math.sin(t * 2) * 3;
  stars.rotation.y += 0.0005;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
